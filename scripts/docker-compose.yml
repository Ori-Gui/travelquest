version: '3.8'

services:
  travelog-mysql:
    image: mysql:latest
    container_name: travelog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ssafytrip
      MYSQL_USER: travelog
      MYSQL_PASSWORD: travelog
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - travelog-network

  travelog-adminer:
    image: adminer:latest
    container_name: travelog-adminer
    environment:
      ADMINER_DEFAULT_SERVER: travelog-mysql
    ports:
      - "18080:8080"
    networks:
      - travelog-network

  travelog-redis:
    image: redis:latest
    container_name: travelog-redis
    ports:
      - "6379:6379"
    networks:
      - travelog-network

networks:
  travelog-network:
    driver: bridge
